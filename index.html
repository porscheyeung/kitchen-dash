<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf7ef" />
    <meta
      name="description"
      content="從第一份早餐到主廚盛宴，10 關漸進式料理挑戰。"
    />
    <title>Kitchen Dash · 小廚師日記</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Kitchen Dash 首頁"
        ><span class="brand-icon">🍳</span
        ><span>Kitchen Dash<small>小廚師日記</small></span></a
      ><span class="header-note">好料理，從一點點練習開始。</span
      ><button
        id="sound"
        class="icon-button"
        aria-label="開啟音效"
        aria-pressed="false"
      >
        ♪ 音效關
      </button>
    </header>
    <main id="app"></main>
    <dialog id="pauseDialog" aria-labelledby="pauseTitle">
      <span class="dialog-icon">☕</span>
      <h2 id="pauseTitle">休息一下，廚房等你</h2>
      <p>計時與烹調已暫停。</p>
      <button id="resume" class="primary">繼續料理</button
      ><button id="leave" class="secondary">返回選關</button>
    </dialog>
    <script src="game.js"></script>
  </body>
</html>
